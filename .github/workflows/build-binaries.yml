# One-file GUI bundles (PyInstaller). Run manually or on version tags; artifacts per OS.
name: Build binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ImageCutter-windows-amd64
            out_file: dist/ImageCutter.exe
          - os: macos-latest
            artifact_name: ImageCutter-macos
            out_file: dist/ImageCutter
          - os: ubuntu-latest
            artifact_name: ImageCutter-linux-amd64
            out_file: dist/ImageCutter

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Linux packages (tkinter + OpenCV deps for analysis)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libglib2.0-0

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.0,<7"

      - name: Verify tkinter (required for PyInstaller to bundle GUI)
        run: python -c "import tkinter; print('tkinter OK')"

      - name: Build one-file executable
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "ImageCutter" \
            --collect-all cv2 \
            app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.out_file }}
          if-no-files-found: error

  # Only on tag pushes: attach all platform builds to the GitHub Release (not workflow_dispatch).
  release-assets:
    name: Attach to GitHub Release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: ImageCutter-*

      - name: Stage files for release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p upload
          cp "artifacts/ImageCutter-windows-amd64/ImageCutter.exe" \
            "upload/ImageCutter-${TAG}-windows-amd64.exe"
          cp "artifacts/ImageCutter-macos/ImageCutter" \
            "upload/ImageCutter-${TAG}-macos"
          cp "artifacts/ImageCutter-linux-amd64/ImageCutter" \
            "upload/ImageCutter-${TAG}-linux-amd64"
          chmod +x "upload/ImageCutter-${TAG}-macos" "upload/ImageCutter-${TAG}-linux-amd64"
          ls -la upload

      - name: Upload assets to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: upload/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
